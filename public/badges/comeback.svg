<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#20b2aa" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#20b2aa" stroke-width="2"/>
  
  <!-- Comeback symbol - three upward arrows -->
  <g transform="translate(100, 100)">
    <!-- Rising arrows -->
    <path d="M -25 20 L -25 -10 L -30 -5 L -25 -10 L -20 -5" 
          fill="none" stroke="#20b2aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 15 L 0 -20 L -5 -15 L 0 -20 L 5 -15" 
          fill="none" stroke="#20b2aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 25 20 L 25 -10 L 20 -5 L 25 -10 L 30 -5" 
          fill="none" stroke="#20b2aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" 
          fill="#20b2aa" text-anchor="middle">COMEBACK</text>
  </g>
</svg>
