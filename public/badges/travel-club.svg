<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#4CAF50" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- Airplane and globe -->
  <g transform="translate(100, 90)">
    <!-- Globe -->
    <circle cx="0" cy="5" r="20" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <ellipse cx="0" cy="5" rx="20" ry="8" fill="none" stroke="#4CAF50" stroke-width="1.5"/>
    <line x1="0" y1="-15" x2="0" y2="25" stroke="#4CAF50" stroke-width="1.5"/>
    
    <!-- Airplane -->
    <g transform="translate(0, -20)">
      <polygon points="0,-8 -12,-3 -12,0 -4,0 -6,4 -3,4 0,0 3,4 6,4 4,0 12,0 12,-3" fill="#4CAF50"/>
      <rect x="-1" y="-8" width="2" height="6" fill="#4CAF50"/>
    </g>
    
    <!-- Motion trail -->
    <path d="M -15 -15 Q -10 -18 -5 -16" fill="none" stroke="#4CAF50" stroke-width="1" opacity="0.5" stroke-dasharray="2,2"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
          fill="#4CAF50" text-anchor="middle">TRAVEL CLUB</text>
  </g>
</svg>
