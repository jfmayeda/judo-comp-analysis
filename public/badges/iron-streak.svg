<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#ff6347" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ff6347" stroke-width="2"/>
  
  <!-- Fire/streak symbol -->
  <g transform="translate(100, 95)">
    <!-- Flame shape -->
    <path d="M 0,-25 Q -8,-15 -5,0 Q -10,5 -8,15 Q -5,10 0,15 Q 5,10 8,15 Q 10,5 5,0 Q 8,-15 0,-25 Z" 
          fill="#ff6347"/>
    
    <!-- Inner flame -->
    <path d="M 0,-15 Q -4,-8 -2,5 Q 0,3 2,5 Q 4,-8 0,-15 Z" 
          fill="#ffa500"/>
    
    <!-- Calendar ticks below -->
    <rect x="-18" y="20" width="4" height="8" rx="1" fill="#ff6347"/>
    <rect x="-9" y="20" width="4" height="8" rx="1" fill="#ff6347"/>
    <rect x="0" y="20" width="4" height="8" rx="1" fill="#ff6347"/>
    <rect x="9" y="20" width="4" height="8" rx="1" fill="#ff6347"/>
    <rect x="18" y="20" width="4" height="8" rx="1" fill="#ff6347"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" 
          fill="#ff6347" text-anchor="middle">IRON STREAK</text>
  </g>
</svg>
