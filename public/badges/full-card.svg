<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#ff8c00" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ff8c00" stroke-width="2"/>
  
  <!-- Tournament bracket filled -->
  <g transform="translate(100, 90)">
    <!-- Left side bracket -->
    <g transform="translate(-35, 0)">
      <line x1="0" y1="-20" x2="10" y2="-20" stroke="#ff8c00" stroke-width="2"/>
      <line x1="0" y1="-10" x2="10" y2="-10" stroke="#ff8c00" stroke-width="2"/>
      <line x1="10" y1="-20" x2="10" y2="-10" stroke="#ff8c00" stroke-width="2"/>
      <line x1="10" y1="-15" x2="20" y2="-15" stroke="#ff8c00" stroke-width="2"/>
      
      <line x1="0" y1="10" x2="10" y2="10" stroke="#ff8c00" stroke-width="2"/>
      <line x1="0" y1="20" x2="10" y2="20" stroke="#ff8c00" stroke-width="2"/>
      <line x1="10" y1="10" x2="10" y2="20" stroke="#ff8c00" stroke-width="2"/>
      <line x1="10" y1="15" x2="20" y2="15" stroke="#ff8c00" stroke-width="2"/>
    </g>
    
    <!-- Right side bracket -->
    <g transform="translate(35, 0) scale(-1, 1)">
      <line x1="0" y1="-20" x2="10" y2="-20" stroke="#ff8c00" stroke-width="2"/>
      <line x1="0" y1="-10" x2="10" y2="-10" stroke="#ff8c00" stroke-width="2"/>
      <line x1="10" y1="-20" x2="10" y2="-10" stroke="#ff8c00" stroke-width="2"/>
      <line x1="10" y1="-15" x2="20" y2="-15" stroke="#ff8c00" stroke-width="2"/>
      
      <line x1="0" y1="10" x2="10" y2="10" stroke="#ff8c00" stroke-width="2"/>
      <line x1="0" y1="20" x2="10" y2="20" stroke="#ff8c00" stroke-width="2"/>
      <line x1="10" y1="10" x2="10" y2="20" stroke="#ff8c00" stroke-width="2"/>
      <line x1="10" y1="15" x2="20" y2="15" stroke="#ff8c00" stroke-width="2"/>
    </g>
    
    <!-- Yin yang in center -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ff8c00" stroke-width="2"/>
    <path d="M 0,-10 A 5,5 0 0,1 0,0 A 5,5 0 0,0 0,10 A 10,10 0 0,1 0,-10 Z" fill="#ff8c00"/>
    <circle cx="0" cy="-5" r="2" fill="#1e3a5f"/>
    <circle cx="0" cy="5" r="2" fill="#ff8c00"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" 
          fill="#ff8c00" text-anchor="middle">FULL CARD</text>
  </g>
</svg>
