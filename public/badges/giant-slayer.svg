<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#d4af37" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- David vs Goliath - small figure defeating large -->
  <g transform="translate(100, 95)">
    <!-- Large figure (fallen) -->
    <rect x="-5" y="10" width="25" height="8" rx="2" fill="#555"/>
    <circle cx="20" cy="10" r="6" fill="#555"/>
    
    <!-- Small figure (victorious) -->
    <circle cx="-20" cy="-15" r="5" fill="#d4af37"/>
    <rect x="-23" y="-8" width="6" height="12" rx="1" fill="#d4af37"/>
    <path d="M -20 -8 L -28 -3" stroke="#d4af37" stroke-width="2"/>
    <path d="M -20 -8 L -12 -3" stroke="#d4af37" stroke-width="2"/>
    
    <!-- Victory star -->
    <polygon points="-20,-30 -22,-24 -28,-24 -23,-20 -25,-14 -20,-18 -15,-14 -17,-20 -12,-24 -18,-24" fill="#d4af37"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
          fill="#d4af37" text-anchor="middle">GIANT SLAYER</text>
  </g>
</svg>
