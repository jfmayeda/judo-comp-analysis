<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#d4af37" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Half star for waza-ari -->
  <g transform="translate(100, 90)">
    <defs>
      <clipPath id="halfClip">
        <rect x="-30" y="-30" width="30" height="60"/>
      </clipPath>
    </defs>
    
    <!-- Full star outline -->
    <polygon points="0,-25 -7,-8 -25,-8 -12,3 -17,20 0,10 17,20 12,3 25,-8 7,-8" 
             fill="none" stroke="#d4af37" stroke-width="2"/>
    
    <!-- Half filled -->
    <polygon points="0,-25 -7,-8 -25,-8 -12,3 -17,20 0,10 17,20 12,3 25,-8 7,-8" 
             fill="#d4af37" clip-path="url(#halfClip)"/>
    
    <!-- Plus sign indicating accumulation -->
    <g transform="translate(25, -20)">
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#d4af37" stroke-width="2"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#d4af37" stroke-width="2"/>
    </g>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" 
          fill="#d4af37" text-anchor="middle">WAZA-ARI</text>
  </g>
</svg>
