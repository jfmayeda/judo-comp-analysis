<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#d4af37" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Building blocks of techniques -->
  <g transform="translate(100, 95)">
    <!-- Stack of technique blocks -->
    <rect x="-15" y="5" width="30" height="8" rx="2" fill="#d4af37"/>
    <rect x="-12" y="-5" width="24" height="8" rx="2" fill="#d4af37"/>
    <rect x="-9" y="-15" width="18" height="8" rx="2" fill="#d4af37"/>
    
    <!-- Star on top (mastery) -->
    <polygon points="0,-30 -3,-23 -10,-23 -5,-18 -7,-11 0,-16 7,-11 5,-18 10,-23 3,-23" fill="#d4af37"/>
    
    <!-- Judo symbols on blocks -->
    <circle cx="0" cy="9" r="2" fill="#1e3a5f"/>
    <circle cx="0" cy="-1" r="2" fill="#1e3a5f"/>
    <circle cx="0" cy="-11" r="2" fill="#1e3a5f"/>
    
    <!-- Foundation lines -->
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#d4af37" stroke-width="2"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
          fill="#d4af37" text-anchor="middle">TOKUI BUILDER</text>
  </g>
</svg>
