<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#ffd700" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ffd700" stroke-width="2"/>
  
  <!-- Gold medal -->
  <g transform="translate(100, 90)">
    <!-- Ribbon -->
    <rect x="-6" y="-25" width="12" height="22" rx="1" fill="#ffd700"/>
    <polygon points="-6,2 0,-4 6,2 6,10 3,8 0,10 -3,8 -6,10" fill="#ffd700"/>
    
    <!-- Medal circle -->
    <circle cx="0" cy="18" r="20" fill="#ffd700"/>
    <circle cx="0" cy="18" r="16" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <circle cx="0" cy="18" r="12" fill="none" stroke="#1e3a5f" stroke-width="1"/>
    
    <!-- Star in center -->
    <polygon points="0,10 -2,15 -7,15 -3,18 -5,23 0,20 5,23 3,18 7,15 2,15" fill="#1e3a5f"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
          fill="#ffd700" text-anchor="middle">GOLD</text>
  </g>
</svg>
