<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#d4af37" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Fist symbol with rope/grip -->
  <g transform="translate(100, 95)">
    <!-- Rope circle -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="3,2"/>
    
    <!-- Fist -->
    <rect x="-12" y="-5" width="24" height="18" rx="3" fill="#d4af37"/>
    <rect x="-10" y="-12" width="6" height="8" rx="2" fill="#d4af37"/>
    <rect x="-3" y="-14" width="6" height="10" rx="2" fill="#d4af37"/>
    <rect x="4" y="-12" width="6" height="8" rx="2" fill="#d4af37"/>
    
    <!-- Star above for excellence -->
    <polygon points="0,-35 -3,-28 -10,-28 -5,-23 -7,-16 0,-21 7,-16 5,-23 10,-28 3,-28" fill="#d4af37"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" 
          fill="#d4af37" text-anchor="middle">IRON GRIP</text>
  </g>
</svg>
