<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#ff6347" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ff6347" stroke-width="2"/>
  
  <!-- Determined figure - never give up -->
  <g transform="translate(100, 95)">
    <!-- Figure standing strong -->
    <circle cx="0" cy="-15" r="8" fill="#ff6347"/>
    <rect x="-6" y="-5" width="12" height="20" rx="2" fill="#ff6347"/>
    
    <!-- Arms raised (determined stance) -->
    <line x1="-6" y1="-5" x2="-15" y2="-10" stroke="#ff6347" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="-5" x2="15" y2="-10" stroke="#ff6347" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Legs planted -->
    <line x1="-3" y1="15" x2="-8" y2="25" stroke="#ff6347" stroke-width="3" stroke-linecap="round"/>
    <line x1="3" y1="15" x2="8" y2="25" stroke="#ff6347" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Heart symbol -->
    <path d="M -5,-30 Q -10,-35 -15,-30 Q -15,-25 -10,-20 L 0,-10 L 10,-20 Q 15,-25 15,-30 Q 10,-35 5,-30 Q 0,-25 0,-25 Q 0,-25 -5,-30 Z" 
          fill="#ff6347" transform="scale(0.5) translate(0, -20)"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
          fill="#ff6347" text-anchor="middle">GRIT</text>
  </g>
</svg>
