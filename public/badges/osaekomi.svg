<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#d4af37" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Pin/hold symbol -->
  <g transform="translate(100, 90)">
    <!-- Mat -->
    <rect x="-30" y="15" width="60" height="4" rx="2" fill="#d4af37"/>
    
    <!-- Top figure (holding) -->
    <circle cx="0" cy="-5" r="7" fill="#d4af37"/>
    <rect x="-8" y="3" width="16" height="8" rx="2" fill="#d4af37"/>
    
    <!-- Clock/timer -->
    <circle cx="0" cy="-25" r="10" fill="none" stroke="#d4af37" stroke-width="2"/>
    <line x1="0" y1="-25" x2="0" y2="-30" stroke="#d4af37" stroke-width="2"/>
    <line x1="0" y1="-25" x2="5" y2="-25" stroke="#d4af37" stroke-width="2"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" 
          fill="#d4af37" text-anchor="middle">OSAEKOMI</text>
  </g>
</svg>
