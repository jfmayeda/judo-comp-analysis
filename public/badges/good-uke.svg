<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#d4af37" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Two figures partnering -->
  <g transform="translate(100, 95)">
    <!-- Left figure (uke) -->
    <circle cx="-15" cy="-15" r="6" fill="#d4af37"/>
    <rect x="-18" y="-8" width="6" height="14" rx="1" fill="#d4af37"/>
    <path d="M -15 -8 L -22 0" stroke="#d4af37" stroke-width="2"/>
    
    <!-- Right figure (tori) -->
    <circle cx="15" cy="-15" r="6" fill="#d4af37"/>
    <rect x="12" y="-8" width="6" height="14" rx="1" fill="#d4af37"/>
    <path d="M 15 -8 L 22 0" stroke="#d4af37" stroke-width="2"/>
    
    <!-- Connection/handshake -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#d4af37" stroke-width="3"/>
    
    <!-- Laurel wreath below -->
    <path d="M -20 15 Q -15 10 -10 15 Q -5 10 0 15 Q 5 10 10 15 Q 15 10 20 15" 
          fill="none" stroke="#d4af37" stroke-width="2"/>
    <path d="M -20 20 Q -15 15 -10 20 Q -5 15 0 20 Q 5 15 10 20 Q 15 15 20 20" 
          fill="none" stroke="#d4af37" stroke-width="2"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" 
          fill="#d4af37" text-anchor="middle">GOOD UKE</text>
  </g>
</svg>
