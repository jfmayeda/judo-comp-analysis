<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#6a5acd" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#6a5acd" stroke-width="2"/>
  
  <!-- Calm, centered figure in meditation pose -->
  <g transform="translate(100, 95)">
    <!-- Figure -->
    <circle cx="0" cy="-15" r="7" fill="#6a5acd"/>
    <rect x="-5" y="-6" width="10" height="12" rx="2" fill="#6a5acd"/>
    
    <!-- Meditation arms -->
    <circle cx="-12" cy="2" r="4" fill="#6a5acd"/>
    <circle cx="12" cy="2" r="4" fill="#6a5acd"/>
    
    <!-- Legs crossed -->
    <ellipse cx="0" cy="10" rx="12" ry="6" fill="#6a5acd"/>
    
    <!-- Zen circles (ensM) around figure -->
    <circle cx="0" cy="-5" r="25" fill="none" stroke="#6a5acd" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="-5" r="32" fill="none" stroke="#6a5acd" stroke-width="1" opacity="0.4"/>
    
    <!-- Small sparkles -->
    <circle cx="-20" cy="-20" r="1.5" fill="#6a5acd"/>
    <circle cx="20" cy="-20" r="1.5" fill="#6a5acd"/>
    <circle cx="0" cy="-35" r="1.5" fill="#6a5acd"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="7" font-weight="bold" 
          fill="#6a5acd" text-anchor="middle">QUIET CONFIDENCE</text>
  </g>
</svg>
