<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#d4af37" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Counter-attack circular motion -->
  <g transform="translate(100, 90)">
    <!-- Circular arrow showing reversal -->
    <path d="M 0,-25 A 25,25 0 1,1 0,25" fill="none" stroke="#d4af37" stroke-width="4"/>
    <polygon points="0,25 -5,18 5,18" fill="#d4af37"/>
    
    <!-- Attack coming in (faded) -->
    <path d="M -35,-10 L -15,-5" stroke="#888" stroke-width="3" opacity="0.5"/>
    <polygon points="-15,-5 -20,-8 -20,-2" fill="#888" opacity="0.5"/>
    
    <!-- Counter going out (bright) -->
    <path d="M 15,5 L 35,15" stroke="#d4af37" stroke-width="3"/>
    <polygon points="35,15 30,12 30,18" fill="#d4af37"/>
    
    <!-- Center pivot point -->
    <circle cx="0" cy="0" r="6" fill="#d4af37"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
          fill="#d4af37" text-anchor="middle">COUNTER</text>
  </g>
</svg>
