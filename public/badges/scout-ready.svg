<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#4CAF50" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- Clipboard with notes + magnifying glass -->
  <g transform="translate(100, 90)">
    <!-- Clipboard -->
    <rect x="-18" y="-15" width="28" height="38" rx="2" fill="#4CAF50"/>
    <rect x="-15" y="-12" width="22" height="32" rx="1" fill="#fff"/>
    
    <!-- Clip -->
    <rect x="-5" y="-18" width="10" height="4" rx="2" fill="#4CAF50"/>
    
    <!-- Notes lines -->
    <line x1="-11" y1="-5" x2="6" y2="-5" stroke="#4CAF50" stroke-width="1.5"/>
    <line x1="-11" y1="0" x2="6" y2="0" stroke="#4CAF50" stroke-width="1.5"/>
    <line x1="-11" y1="5" x2="6" y2="5" stroke="#4CAF50" stroke-width="1.5"/>
    <line x1="-11" y1="10" x2="6" y2="10" stroke="#4CAF50" stroke-width="1.5"/>
    
    <!-- Magnifying glass -->
    <circle cx="20" cy="-5" r="8" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <line x1="26" y1="1" x2="32" y2="7" stroke="#4CAF50" stroke-width="2"/>
    
    <!-- Checkmark in glass -->
    <path d="M 16 -5 L 19 -2 L 24 -9" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
          fill="#4CAF50" text-anchor="middle">SCOUT READY</text>
  </g>
</svg>
