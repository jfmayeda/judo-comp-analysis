<svg xmlns="http://www.w3.org/2000/200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#d4af37" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Combo chain - three connected arrows -->
  <g transform="translate(100, 90)">
    <circle cx="-30" cy="0" r="8" fill="#d4af37"/>
    <path d="M -22 0 L -12 0" stroke="#d4af37" stroke-width="3"/>
    <path d="M -12 0 L -8 -4 L -8 4 Z" fill="#d4af37"/>
    
    <circle cx="0" cy="0" r="8" fill="#d4af37"/>
    <path d="M 8 0 L 18 0" stroke="#d4af37" stroke-width="3"/>
    <path d="M 18 0 L 22 -4 L 22 4 Z" fill="#d4af37"/>
    
    <circle cx="30" cy="0" r="8" fill="#d4af37"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
          fill="#d4af37" text-anchor="middle">RENZOKU</text>
  </g>
</svg>
