<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#9370db" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#9370db" stroke-width="2"/>
  
  <!-- Triangle formation -->
  <g transform="translate(100, 100)">
    <path d="M 0,-30 L -26,15 L 26,15 Z" 
          fill="none" stroke="#9370db" stroke-width="4"/>
    
    <!-- Inner smaller triangle -->
    <path d="M 0,-15 L -13,8 L 13,8 Z" 
          fill="#9370db"/>
    
    <!-- Three circles at vertices -->
    <circle cx="0" cy="-30" r="5" fill="#9370db"/>
    <circle cx="-26" cy="15" r="5" fill="#9370db"/>
    <circle cx="26" cy="15" r="5" fill="#9370db"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
          fill="#9370db" text-anchor="middle">SANKAKU</text>
  </g>
</svg>
