<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" stroke="#c0c0c0" stroke-width="5"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#c0c0c0" stroke-width="2"/>
  
  <!-- Ambidextrous symbol - arrows both directions -->
  <g transform="translate(100, 100)">
    <!-- Left arrow -->
    <path d="M -40 0 L -25 -8 L -25 -3 L 0 -3 L 0 3 L -25 3 L -25 8 Z" fill="#c0c0c0"/>
    <!-- Right arrow -->
    <path d="M 40 0 L 25 -8 L 25 -3 L 0 -3 L 0 3 L 25 3 L 25 8 Z" fill="#c0c0c0"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#c0c0c0" stroke-width="2"/>
    <!-- Person icon -->
    <circle cx="0" cy="-18" r="5" fill="#c0c0c0"/>
    <path d="M -8 -10 L 0 -5 L 8 -10" stroke="#c0c0c0" stroke-width="2" fill="none"/>
  </g>
  
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
          fill="#c0c0c0" text-anchor="middle">AMBIDEX</text>
  </g>
</svg>
